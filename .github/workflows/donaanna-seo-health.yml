name: Doña Anna SEO health
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  seo-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check live Doña Anna URLs and metadata
        run: node scripts/check-donaanna-seo.mjs
